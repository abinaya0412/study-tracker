{% extends 'base.html' %}
{% load static %}

{% block title %}Settings - Study Time Tracker{% endblock %}

{% block content %}
<div class="container" style="max-width: 800px;">
    <h1 class="page-title mb-4">Settings</h1>
    
    <div class="card mb-4">
        <div class="card-header">
            <h3 class="card-title">Change Password</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label">Current Password</label>
                    <input type="password" class="form-control" name="current_password" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" name="new_password" required>
                    <small class="form-text">Minimum 8 characters</small>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" name="confirm_password" required>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-key"></i>
                    Change Password
                </button>
            </form>
        </div>
    </div>
    
    <div class="card mb-4">
        <div class="card-header">
            <h3 class="card-title">Notification Preferences</h3>
        </div>
        <div class="card-body">
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="emailNotifications" checked>
                <label class="form-check-label" for="emailNotifications">
                    Email notifications for goal achievements
                </label>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="dailyReminder" checked>
                <label class="form-check-label" for="dailyReminder">
                    Daily study reminder
                </label>
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="weeklyReport" checked>
                <label class="form-check-label" for="weeklyReport">
                    Weekly progress report
                </label>
            </div>
        </div>
    </div>
    
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Privacy Settings</h3>
        </div>
        <div class="card-body">
            <div class="form-group">
                <label class="form-label">Profile Visibility</label>
                <select class="form-control">
                    <option value="private">Private - Only you can see your data</option>
                    <option value="public">Public - Anyone can see your achievements</option>
                </select>
            </div>
        </div>
    </div>
</div>
{% endblock %}
